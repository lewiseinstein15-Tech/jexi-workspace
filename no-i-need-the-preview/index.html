<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Simple Interactive Web App</title></head><body><h1>Welcome to My Web App</h1><p id="message">This is the initial message.</p><button id="changeButton">Click Me</button><script>document.getElementById("changeButton").addEventListener("click", function() {document.getElementById("message").textContent = "Message updated!";});</script></body></html>
