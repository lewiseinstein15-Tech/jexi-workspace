<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Web App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f0f0f0; }
        #app { background-color: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); max-width: 600px; margin: 0 auto; }
        #date-time { font-size: 24px; margin: 20px 0; color: #333; }
        button { background-color: #4CAF50; color: white; border: none; padding: 10px 20px; text-align: center; display: inline-block; font-size: 16px; margin: 10px 0; cursor: pointer; border-radius: 5px; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <div id="app">
        <h1>Welcome to My Web App</h1>
        <div id="date-time">Loading...</div>
        <button id="update-btn">Update Time</button>
    </div>
    <script>
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: long,
                year: numeric,
                month: long,
                day: numeric,
                hour: 2-digit,
                minute: 2-digit,
                second: 2-digit
            };
            document.getElementById(date-time).textContent = now.toLocaleDateString(en-US, options);
        }
        updateDateTime();
        document.getElementById(update-btn).addEventListener("click", updateDateTime);
    </script>
</body>
</html>
